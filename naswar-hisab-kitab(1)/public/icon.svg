<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Book / Ledger shape -->
  <g filter="url(#shadow)">
    <!-- Book Backing -->
    <rect x="96" y="80" width="320" height="352" rx="24" fill="#047857" stroke="#10b981" stroke-width="4"/>
    
    <!-- Spine -->
    <path d="M 96,104 C 96,90.7 106.7,80 120,80 L 148,80 L 148,432 L 120,432 C 106.7,432 96,421.3 96,408 Z" fill="url(#goldGrad)"/>
    
    <!-- Spine Stitch Marks -->
    <line x1="122" y1="120" x2="122" y2="160" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="122" y1="236" x2="122" y2="276" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>
    <line x1="122" y1="352" x2="122" y2="392" stroke="#78350f" stroke-width="4" stroke-linecap="round"/>

    <!-- Ledger Pages edge -->
    <rect x="396" y="96" width="20" height="320" rx="6" fill="#fef3c7"/>
    
    <!-- Inner emblem / seal -->
    <circle cx="272" cy="190" r="54" fill="url(#goldGrad)"/>
    <circle cx="272" cy="190" r="46" fill="#064e3b"/>
    <!-- Rupees / Hisab icon -->
    <text x="272" y="206" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#fbbf24" text-anchor="middle">Rs.</text>

    <!-- Ledger lines -->
    <rect x="180" y="275" width="184" height="12" rx="6" fill="#6ee7b7" opacity="0.9"/>
    <rect x="180" y="305" width="184" height="12" rx="6" fill="#6ee7b7" opacity="0.6"/>
    <rect x="180" y="335" width="140" height="12" rx="6" fill="#6ee7b7" opacity="0.6"/>
    <rect x="180" y="365" width="100" height="12" rx="6" fill="#fbbf24" opacity="0.8"/>
  </g>
</svg>
